global:
  scrape_interval: 15s
scrape_configs:
  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["order-service:8081"]}]
  - job_name: restaurant
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["restaurant-service:8082"]}]
  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["payment-service:8083"]}]
  - job_name: delivery
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["delivery-service:8084"]}]
  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["notification-service:8085"]}]
