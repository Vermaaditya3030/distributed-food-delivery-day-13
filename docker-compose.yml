services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10}
  db-init:
    image: postgres:16
    depends_on: {postgres: {condition: service_healthy}}
    environment: {PGPASSWORD: postgres}
    entrypoint: ["/bin/bash","-c"]
    command: ["for db in orders restaurants payments delivery; do psql -h postgres -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='$db'\" | grep -q 1 || psql -h postgres -U postgres -c \"CREATE DATABASE $db\"; done"]
  redis: {image: redis:7-alpine, ports: ["6379:6379"]}
  zookeeper: {image: bitnami/zookeeper:3.9, environment: {ALLOW_ANONYMOUS_LOGIN: "yes"}}
  kafka:
    image: bitnami/kafka:3.8
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment: {KAFKA_CFG_NODE_ID: 1, KAFKA_CFG_PROCESS_ROLES: broker,controller, KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093, KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093, KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092, KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER, KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true", ALLOW_PLAINTEXT_LISTENER: "yes"}
  order-service: {build: ./order-service, depends_on: [postgres, db-init], environment: {DB_HOST: postgres}, ports: ["8081:8081"]}
  restaurant-service: {build: ./restaurant-service, depends_on: [postgres, db-init], environment: {DB_HOST: postgres}, ports: ["8082:8082"]}
  payment-service: {build: ./payment-service, depends_on: [postgres, db-init], environment: {DB_HOST: postgres}, ports: ["8083:8083"]}
  delivery-service: {build: ./delivery-service, depends_on: [postgres, db-init, redis], environment: {DB_HOST: postgres, REDIS_HOST: redis}, ports: ["8084:8084"]}
  notification-service: {build: ./notification-service, depends_on: [kafka], environment: {KAFKA_BOOTSTRAP: kafka:9092}, ports: ["8085:8085"]}
  prometheus: {image: prom/prometheus:v2.55.1, volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"], ports: ["9090:9090"]}
  grafana: {image: grafana/grafana:11.3.1, ports: ["3000:3000"]}
volumes: {pgdata: {}}
